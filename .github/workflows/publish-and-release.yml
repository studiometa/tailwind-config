name: publish-and-release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (the pre* bumps create a prerelease)'
        type: choice
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
        default: patch
      preid:
        description: 'Prerelease identifier, used by the pre* bumps only'
        type: choice
        options: [alpha, beta, rc]
        default: alpha

concurrency: release

jobs:
  release:
    name: Bump version and changelog
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      # A promotion has no fragment, so no changelog section: say what it promotes.
      body: ${{ steps.changelog.outputs.changed == 'true' && steps.changelog.outputs.body || format('Stable release of {0}.', steps.version.outputs.previous) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The changelog action reads the commit that added each fragment.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
        run: |
          PREVIOUS=$(node -p 'require("./package.json").version')
          npm version "$BUMP" --preid "$PREID" --workspaces --include-workspace-root --no-workspaces-update --no-git-tag-version
          VERSION=$(node -p 'require("./package.json").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          # A version with a prerelease part (1.2.0-beta.0) goes to the `next` dist-tag.
          if [[ $VERSION == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi
          # A stable version after a prerelease (1.2.0-rc.1 → 1.2.0) promotes it.
          if [[ $PREVIOUS == *-* && $VERSION != *-* ]]; then
            echo "promotion=true" >> "$GITHUB_OUTPUT"
          else
            echo "promotion=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fold changelog fragments
        id: changelog
        uses: weareikko/changelog@600f4225cfd2778967eaffa693e86666c5a2d4bd # 1.0.2
        with:
          command: release
          version: v${{ steps.version.outputs.version }}

      # The fragments of a prerelease are folded into its own section, so
      # promoting it to a stable version can have no fragment.
      - name: Fail when there is nothing to release
        if: steps.changelog.outputs.changed != 'true' && steps.version.outputs.promotion != 'true'
        run: |
          echo "::error::No fragment in .changelog/: nothing to release."
          exit 1

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changelog package.json package-lock.json packages/*/package.json
          git commit -m "Release $VERSION"
          git tag "$VERSION"
          git push origin HEAD:main "$VERSION"

  # A tag pushed with GITHUB_TOKEN does not start other workflows, so publishing
  # runs in the same workflow, after the release job.
  # npm trusted publishing (OIDC, no npm token) is bound to this file name: keep
  # this job in publish-and-release.yml, and do not call it from another workflow.
  # Each step is safe to replay: "Re-run failed jobs" skips a version that npm
  # already has and updates a GitHub release that already exists.
  publish-and-release:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.version }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Publish @studiometa/tailwind-config
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/tailwind-config
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}

      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.release.outputs.version }}
          name: v${{ needs.release.outputs.version }}
          body: ${{ needs.release.outputs.body }}
          draft: false
          prerelease: ${{ needs.release.outputs.prerelease }}
          makeLatest: ${{ needs.release.outputs.prerelease == 'true' && 'false' || 'true' }}
          allowUpdates: true
