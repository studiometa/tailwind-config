name: publish-and-release

# Each merge into main releases what its fragments describe. A manual run
# (`gh workflow run publish-and-release.yml -f version=major`) forces a bump.
# npm trusted publishing is bound to this file name: keep the publish job here.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version: `auto` follows the fragments; `patch`, `minor` or `major` forces that bump'
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# One release at a time. GitHub keeps only the newest pending run: it
# releases everything that main has at that point.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Folds the fragments, bumps the root and workspace package.json files,
  # commits `Release <version>`, tags, pushes and creates the GitHub release.
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Release
        id: release
        uses: weareikko/changelog@9d93346df9858eaa29007bd8530aad8f4c5b539a # 0.1.0
        with:
          command: release
          version: ${{ inputs.version || 'auto' }}
          skip-authors: |
            renovate[bot]
            dependabot[bot]

  # "Re-run failed jobs" on this job publishes what a failed run left: npm
  # skips a version that it already has.
  publish:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # The package is plain CSS: no install and no build. Trusted publishing
      # (OIDC): no npm token. A prerelease goes to `next`.
      - name: Publish @studiometa/tailwind-config
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/tailwind-config
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}
